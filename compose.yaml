name: czu-stream-recorder

services:
  recorder:
    image: ghcr.io/vojtechzicha/czu-stream-recorder:latest
    # build: .            # or build the image yourself instead of pulling it
    container_name: czu-stream-recorder
    restart: unless-stopped
    # Run as a dedicated unprivileged user that can write only the mounted folders (see README). Set in .env.
    user: "${PUID:-1000}:${PGID:-100}"
    environment:
      TZ: ${TZ:-Europe/Prague}
    volumes:
      - ./config:/config:ro
      - ${RECORDINGS_DIR:-./recordings}:/recordings   # MP4 files (e.g. a Plex library)
      - ${NOTES_DIR:-./notes}:/notes                  # .log and .m4a per recording
      - ./work:/work                                  # segment parts while recording + state
    healthcheck:
      # the schedule must parse; stream problems are logged by the daemon itself
      test: ["CMD", "python", "-m", "recorder", "list", "--config", "/config/schedule.toml"]
      interval: 10m
      timeout: 30s
