# Copy this file to config/schedule.toml and list the sessions to record.
# Times are local (the container's TZ, Europe/Prague by default).
# The recorder re-reads the file every 20 s, so edits apply without a restart.
# Each recording runs from (start - lead_minutes) to (end + tail_minutes).

[defaults]
stream = "kongresovy-sal"
lead_minutes = 10       # start before the scheduled time
# End on silence: after end + min_tail_minutes, stop once silence_minutes pass with no 10-s segment
# peaking above silence_threshold_db (speech peaks ~ -10 to -17 dB, the empty Kongresový sál ~ -62 dB).
# Silence before the scheduled end never stops or trims anything. tail_minutes is then the hard cap.
stop_on_silence = true
min_tail_minutes = 5
silence_minutes = 5
silence_threshold_db = -45
tail_minutes = 90       # hard cap after the scheduled end
# max_height = 720      # cap the quality; default is the best variant (1080p ≈ 1.5 GB/h)
normalize_audio = true  # level the (often quiet) room audio in the MP4 and the M4A

[streams]
# name = HLS master playlist (open the stream page and take the <source src="…m3u8">)
# https://video.czu.cz/live/kongresovy-sal/
kongresovy-sal = "https://wcavp-wowza.czu.cz:4443/live-kongresovy-sal/smil:live-kongresovy-sal.smil/playlist.m3u8"

[[recording]]
title = "Přednáška"     # default file name: "2026-11-21 Přednáška.mp4" (and .m4a/.log in the notes dir)
start = 2026-11-21T08:45:00
end   = 2026-11-21T15:30:00
# Optional paths without extension, relative to the recordings / notes dir. E.g. a Plex TV-show layout:
# video = "ČZU/S01 Ekonomika pro manažery/s01e02.Cvičení"
# notes = "Ekonomika pro manažery/2026-11-21 Cvičení"

